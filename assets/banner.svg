<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.15)" />
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0.05)" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid {
        stroke: rgba(255, 255, 255, 0.04);
        stroke-width: 1;
      }
      .node-pulse {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .orb-float-1 {
        animation: float1 10s ease-in-out infinite alternate;
      }
      .orb-float-2 {
        animation: float2 12s ease-in-out infinite alternate;
      }
      .stream-flow {
        stroke-dasharray: 8, 12;
        animation: flow 20s linear infinite;
      }
      .pill-hover {
        transition: transform 0.3s ease;
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.8; transform: scale(1.02); }
      }
      @keyframes float1 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(40px, 25px); }
      }
      @keyframes float2 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(-30px, -20px); }
      }
      @keyframes flow {
        to { stroke-dashoffset: -200; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Technical Background Grid -->
  <g class="bg-grid">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />
  </g>

  <!-- Animated Glowing Background Orbs (Depth Layer) -->
  <circle class="orb-float-1" cx="180" cy="90" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  <circle class="orb-float-2" cx="1020" cy="120" r="160" fill="#8b5cf6" opacity="0.16" filter="url(#glow)" />
  <circle class="orb-float-1" cx="600" cy="380" r="150" fill="#ec4899" opacity="0.12" filter="url(#glow)" />
  <circle class="orb-float-2" cx="900" cy="340" r="100" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />

  <!-- Connecting Ecosystem Flow Lines (Background Network) -->
  <g class="stream-flow" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4">
    <path d="M 80,240 C 250,140 380,310 600,210 C 820,110 950,290 1120,190" />
    <path d="M 120,100 C 350,280 500,80 750,260 C 950,380 1020,150 1150,300" opacity="0.3" />
  </g>

  <!-- Background Decorative Nodes / Micro Badges -->
  <g opacity="0.55">
    <circle cx="850" cy="85" r="4" fill="#8b5cf6" />
    <circle cx="850" cy="85" r="9" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.6" />
    <circle cx="1060" cy="240" r="3" fill="#ec4899" />
    <circle cx="150" cy="310" r="4" fill="#06b6d4" />
    <circle cx="150" cy="310" r="8" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.5" />
    <circle cx="340" cy="65" r="3" fill="#6366f1" />
  </g>

  <!-- FOREGROUND LAYER: Content strictly elevated with crisp readability -->
  
  <!-- Category Tag / Top Badge -->
  <g transform="translate(600, 72)">
    <rect x="-165" y="-18" width="330" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(139, 92, 246, 0.45)" stroke-width="1.2" />
    <circle cx="-135" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-120" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">
      HRMS &amp; WORKFORCE INFRASTRUCTURE
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    Awesome HRMS Ecosystem
  </text>
  <text x="600" y="165" text-anchor="middle" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="52" font-weight="800" letter-spacing="-1" opacity="0.25" filter="url(#cardGlow)">
    Awesome HRMS Ecosystem
  </text>

  <!-- Subtitle -->
  <text x="600" y="215" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="19" font-weight="400" letter-spacing="0.2">
    Curated Hub of Leading SaaS Platforms &amp; Autonomous Open-Source HR Systems
  </text>

  <!-- Feature Pillar Cards / Badges (Centered Bottom Row) -->
  <g transform="translate(600, 305)">
    <!-- Card 1: Core HRIS -->
    <g transform="translate(-450, 0)">
      <rect x="0" y="0" width="205" height="52" rx="12" fill="url(#cardGrad)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1.2" />
      <circle cx="28" cy="26" r="10" fill="rgba(99, 102, 241, 0.2)" />
      <text x="28" y="30" text-anchor="middle" fill="#818cf8" font-size="13">👥</text>
      <text x="50" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Core HR &amp; PIM</text>
      <text x="50" y="41" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">Records &amp; Onboarding</text>
    </g>

    <!-- Card 2: Automated Payroll -->
    <g transform="translate(-225, 0)">
      <rect x="0" y="0" width="215" height="52" rx="12" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.2" />
      <circle cx="28" cy="26" r="10" fill="rgba(16, 185, 129, 0.2)" />
      <text x="28" y="30" text-anchor="middle" fill="#34d399" font-size="13">💳</text>
      <text x="50" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Payroll Automation</text>
      <text x="50" y="41" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">Tax, PF, ESI &amp; Slips</text>
    </g>

    <!-- Card 3: Talent & ATS -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="215" height="52" rx="12" fill="url(#cardGrad)" stroke="rgba(236, 72, 153, 0.35)" stroke-width="1.2" />
      <circle cx="28" cy="26" r="10" fill="rgba(236, 72, 153, 0.2)" />
      <text x="28" y="30" text-anchor="middle" fill="#f472b6" font-size="13">🎯</text>
      <text x="50" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Talent &amp; ATS</text>
      <text x="50" y="41" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">Recruitment Pipelines</text>
    </g>

    <!-- Card 4: Open-Source & Self-Hosted -->
    <g transform="translate(245, 0)">
      <rect x="0" y="0" width="205" height="52" rx="12" fill="url(#cardGrad)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1.2" />
      <circle cx="28" cy="26" r="10" fill="rgba(6, 182, 212, 0.2)" />
      <text x="28" y="30" text-anchor="middle" fill="#22d3ee" font-size="13">🛡️</text>
      <text x="50" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Data Sovereignty</text>
      <text x="50" y="41" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">Self-Hosted Freedom</text>
    </g>
  </g>
</svg>
